project:
  type: website
  output-dir: _site

  # The landing page (index.qmd) plus every reveal.js deck (<folder>/index.qmd).
  # Each deck keeps its own front matter / theme.
  render:
    - "index.qmd"
    - "*/index.qmd"

  preview:
    port: 5558
    browser: true

  resources:
    - "photos/**"

brand: "brand/_brand.yml"

website:
  title: "Piyush Chaudhari"
  site-url: "https://pc-piyush.github.io/presentations"
  favicon: "photos/Piyush.png"
  twitter-card:
    creator: "@iampiyushvc"
  navbar:
    logo: "photos/PC_White.png"
    pinned: true
    right:
      - text: "Home"
        href: "https://pc-piyush.github.io"
      # - text: "CV"
      #   href: "https://pc-piyush.github.io/cv.html"
      # - text: "Research"
      #   href: "https://pc-piyush.github.io/research/"
      # - text: "Teaching"
      #   href: "https://pc-piyush.github.io/teaching/"
      # - text: "Presentations"
      #   href: index.qmd
      # - text: "p.log()"
      #   href: "https://pc-piyush.github.io/posts.html"
  page-footer:
    background: "#373a3c"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/piyush-chaudhari/
      - text: "{{< fa brands square-letterboxd >}}"
        url: "https://boxd.it/1uvEr"
    left: |
      <span class="faux-block"> Made with [Quarto](https://quarto.org/).</span>
      <span class="faux-block"> Piyush Chaudhari 2026</span>

format:
  html:
    theme:
      light: [brand, "html/dfb.scss"]
      dark: [brand, "html/dfb_dark.scss"]
    toc: false
    page-layout: full

editor: visual
